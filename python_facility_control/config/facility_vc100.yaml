# Facility profile: port of LabVIEW VC100_Facility_Control_V1.0.vi (medium chamber, 3 turbos, 8 valves).
# Every channel and constant below was read out of that VI (see docs/VC100_REFERENCE.md – the pinout
# table there lists the VI node each line comes from).  Start with:
#     run.bat --config config/facility_vc100.yaml            (real cDAQ if present, else simulator)
#     run.bat --config config/facility_vc100.yaml --sim --time-scale 20
#
# Compared with the small chamber (facility_main_v4.4.yaml) the differences are: the channel map and
# chassis name, six turbo branches since 2026-10-13 (Turbo 1 = Shimadzu contact interface, Turbo 4 = Shimadzu
# HD15 remote, Turbos 2/3/5/6 = HiPace over RS-485; TMP4/5/6 share Turbo 1/2/3's turbo valve and gauge),
# Edwards gauges in mBar, the compressed-air sensor, and the `auto_mode` rules at the bottom.

facility:
  id: vc100
  name: "VC100 Facility Control (medium chamber)"
  daq_name: cDAQ3             # the VI writes 'cDAQ3' into DAQ_Name at start-up (the control's default is cDAQ1)
  loop_period_ms: 100         # Wait Until Next ms Multiple in the main loop
  status_wait_ms: 10          # Wait (ms) after the status frame
  pressure_unit_default: mbar # the VC100 VI works in mBar throughout

# ---------------------------------------------------------------- hardware
analog_input:
  sample_rate_hz: 1000.0      # 'rate' control default (the VI reads the turbo speeds a second time at 4 kHz x 2000 samples)
  samples_per_channel: 25     # 'samples per channel' control default (mean is used)
  min_v: 0.0                  # gauge channels 0..10 V
  max_v: 10.0
  terminal_config: differential  # every AI Create Channel in the VI uses DAQmx 10106 = Differential

gauges:                       # NI-9205 in slot 8.  Order = order of the VI's AI task (array index 0..4)
  - id: wrg
    label: "Wide Range Gauge"
    plot_label: "Main Gauge"
    channel: Mod8/ai0         # 'Wide Range_Gauge_Read'
    formula: edwards_wrg_mbar # 'Ion gauge Pressure calculation (mBar)': P = 10**((V-6.8)/0.6) mBar
    role: main_chamber
  - id: fore
    label: "Foreline Gauge"
    plot_label: "Foreline Gauge"
    channel: Mod8/ai1         # 'Foreline_gauge_1_Read'
    formula: edwards_apg_mbar # 'Foreline 1 Pressure calculation (mBar)': P = 10**((V-6.143)/1.286) mBar
    role: foreline
  - id: turbo1_gauge
    label: "Turbo 1 Gauge"
    plot_label: "Turbo 1 Gauge"
    channel: Mod8/ai2         # 'Turbo_gauge_1_Read'
    formula: edwards_apg_mbar
    role: turbo
    turbo: turbo1
  - id: turbo2_gauge
    label: "Turbo 2 Gauge"
    plot_label: "Turbo 2 Gauge"
    channel: Mod8/ai3         # 'Turbo_gauge_2_Read'
    formula: edwards_apg_mbar
    role: turbo
    turbo: turbo2
  - id: turbo3_gauge
    label: "Turbo 3 Gauge"
    plot_label: "Turbo 3 Gauge"
    channel: Mod8/ai4         # 'Turbo_gauge_3_Read'
    formula: edwards_apg_mbar
    role: turbo
    turbo: turbo3

extra_analog: []              # (Mod8/ai5 and ai6 are the turbo speeds – see the turbo blocks)

compressor:                   # 'Air_Com_pressure' – compressed air for the pneumatic valves
  channel: Mod8/ai7
  scale: 2.0                  # 'Air Compressor Pressure Calc (Bar)': Pressure_Bar = V/5*10
  offset: 0.0

valves:                       # cmd: NI-9375/9472 in slot 1 (24 V = open); read: NI-9375 DI in slot 2 (reed, 24 V = open)
  bypass:       {label: "Bypass Valve",  cmd: Mod1/port0/line0, read: Mod2/port0/line0, kind: bypass, fail_closed: false}
  vent:         {label: "Vent Valve",    cmd: Mod1/port0/line1, read: Mod2/port0/line1, kind: vent,   fail_closed: true}
  turbo1_valve: {label: "Turbo 1 Valve", cmd: Mod1/port0/line2, read: Mod2/port0/line2, kind: turbo,  turbo: turbo1, fail_closed: true}
  turbo2_valve: {label: "Turbo 2 Valve", cmd: Mod1/port0/line3, read: Mod2/port0/line3, kind: turbo,  turbo: turbo2, fail_closed: true}
  turbo3_valve: {label: "Turbo 3 Valve", cmd: Mod1/port0/line4, read: Mod2/port0/line4, kind: turbo,  turbo: turbo3, fail_closed: true}
  gate1:        {label: "Gate 1 Valve",  cmd: Mod1/port0/line5, read: Mod2/port0/line5, kind: gate,   turbo: turbo1, fail_closed: false}
  gate2:        {label: "Gate 2 Valve",  cmd: Mod1/port0/line6, read: Mod2/port0/line6, kind: gate,   turbo: turbo2, fail_closed: false}
  gate3:        {label: "Gate 3 Valve",  cmd: Mod1/port0/line7, read: Mod2/port0/line7, kind: gate,   turbo: turbo3, fail_closed: false}
  # 2026-10-13: gates of the new TMPs.  Commands on the new NI-9472 in slot 5 (line3 = TMP5, line4 = TMP4,
  # line5 = TMP6), open read-backs on Mod2 line22..24.  TMP4/5/6 are backed through Turbo 1/2/3's turbo valve.
  gate4:        {label: "Gate 4 Valve",  cmd: Mod5/port0/line5, read: Mod2/port0/line23, kind: gate,  turbo: turbo4, fail_closed: false}
  gate5:        {label: "Gate 5 Valve",  cmd: Mod5/port0/line3, read: Mod2/port0/line22, kind: gate,  turbo: turbo5, fail_closed: false}
  gate6:        {label: "Gate 6 Valve",  cmd: Mod5/port0/line6, read: Mod2/port0/line24, kind: gate,  turbo: turbo6, fail_closed: false}

primary_pump:
  label: "Primary Pump"
  cmd: Mod4/port0/line0       # 'Primary_Pump_Cmd'
  read: Mod2/port0/line8      # 'Primary_Pump_Read'
  cross_check: true           # the VC100 VI raises 5000 'Conflict between Primary pump command and read!'
                              # (Main_V4.4 had this check disabled).  The 10 s start-up wait below covers the start.
                              # 'Use Ecodry As Primary?' in the VI = a primary pump without read-back: set cross_check: false.

chiller:
  label: "Chiller"
  cmd: Mod4/port0/line1       # 'Chiller_Cmd'
  read: Mod2/port0/line9      # 'Chiller_Read'
  cross_check: true           # error 5004

turbos:
  # ---- Turbo 1: Shimadzu, dry-contact interface.  DO Mod3/port0/line0..2 = Motor / Standby / Reset;
  #      DI Mod2/port0/line10..15 = Rotating, Accelerating, At Speed, Breaking, Alarm, Warning (the VI's
  #      'Turbo 1 <name>' channels, created in a For loop from line 10 upwards).
  #      Alarm and Warning are normally-closed contacts: the VI treats a FALSE read as the condition
  #      ('Not(Turbo Alarm Read) -> Error'), hence *_di_inverted: true.
  - id: turbo1
    label: "Turbo 1"
    in_use: true                  # 'Turbo 1 in use?' constant (True in the VI)
    control_mode: shimadzu_contacts
    gate_valve: gate1
    turbo_valve: turbo1_valve
    gauge: turbo1_gauge
    shimadzu_contacts:
      rotating_di:      Mod2/port0/line10
      accelerating_di:  Mod2/port0/line11
      at_speed_di:      Mod2/port0/line12
      braking_di:       Mod2/port0/line13
      alarm_di:         Mod2/port0/line14
      alarm_di_inverted: true
      warning_di:       Mod2/port0/line15
      warning_di_inverted: true
      motor_do:         Mod3/port0/line0   # 'Turbo 1 Motor CMD'
      standby_do:       Mod3/port0/line1   # 'Turbo 1 Standby CMD'
      error_ack_do:     Mod3/port0/line2   # 'Turbo 1 Reset CMD' – pulsed by 'Reset Turbos' ('Yes, Reset Shimadzu' in the VI)
      error_ack_pulse_ms: 1000
      error_code: 5005                     # VI: error 5005 'Turbo1 Alarm' / 'Turbo1 Warning'
      error_message: "{label} {what}"
      warning_is_error: true               # VI: a Warning also raises 5005 and stops Auto mode; false = show only
  # ---- Turbos 2 and 3: Pfeiffer HiPace / TC 400.  Since 2026-10-09 driven over RS-485
  #      (control_mode: hipace_rs485 - motor, standby, reset, speed and error code on the serial link,
  #      no DAQ lines).  The D-SUB blocks are kept below: set control_mode: hipace_dsub25 to go back.
  #      Turbos on the same `port` share one RS-485 segment (each with its own address); a different
  #      port per turbo also works.  Room for four HiPace - see the template after Turbo 3.
  - id: turbo2
    label: "Turbo 2"
    in_use: true
    control_mode: hipace_rs485
    gate_valve: gate2
    turbo_valve: turbo2_valve
    gauge: turbo2_gauge
    hipace_rs485:                          # ACTIVE (2026-10-09): TC 400 over RS-485, Pfeiffer Vacuum protocol
      port: COM3                           # !! CHECK: the converter's COM port on the lab PC
      address: 2                           # !! CHECK: this pump's [P:797] (both ship at 1 - change one first)
      take_control: true                   # writes [P:060] = 2 at start-up (the D-Sub Motor/Standby lines are then ignored)
      restore_interface_on_exit: false     # true = put [P:060] back to the D-Sub at exit (pump stopped either way)
      comm_warn_s: 3.0                     # no reply for this long -> "No reply N s" on the card (warning only)
      comm_timeout_s: 20.0                 # ... for this long -> link lost (2026-10-28: was 3 s, tripped on a busy bus)
      isolate_on_comm_loss: true           # Auto: link lost -> only this turbo is taken out (gate closed, told to
                                           # stop, backing kept); the rest carries on.  false = error stops Auto
      port_reset_s: 10.0                   # every pump on the port silent this long -> port closed and re-opened
      motor_confirm_s: 5.0                 # [P:010] read-back is cross-checked (5005) only this long after a command
      error_code: 5007
      error_message: "Turbo 2 Error: {error_text}"
      error_requires_chiller: false
      warning_is_error: false              # [P:303] 'Wrn...' is shown but does not stop Auto mode
      standby_speed_min_pct: 40.0
      speed_set_min_pct: 20.0               # speed panel 'Set' slider range, % of nominal (TC 400 accepts 20..100)
      speed_set_max_pct: 100.0
    # D-SUB (previous wiring): DO Mod3/port0/line3..5 = Motor / Standby / Reset; speed on Mod8/ai5
    # (+/-10 V, x10 = %); error on DI Mod2/port0/line16 (24 V = healthy).
    hipace_dsub25:
      speed_ai: Mod8/ai5                   # 'Turbo_2_Speed_Read' (VI: min -10 V, max +10 V, Differential)
      speed_ai_min_v: -10.0
      speed_ai_max_v: 10.0
      error_di: Mod2/port0/line16          # 'Turbo 2 Error read'
      error_di_inverted: true              # VI: And(in use, Not(read)) -> error
      error_requires_chiller: false        # VC100 does not gate the turbo error on the chiller (Main_V4.4 does)
      motor_do: Mod3/port0/line3           # 'Turbo 2 Motor CMD'
      standby_do: Mod3/port0/line4         # 'Turbo 2 Standby CMD'
      error_ack_do: Mod3/port0/line5       # 'Turbo 2 Reset CMD' ('Yes, Reset Both HiPaces')
      error_ack_pulse_ms: 1000
      error_code: 5007                     # VI: 5007 'Turbo 2 Error.'
      error_message: "Turbo 2 Error."
      standby_speed_min_pct: 40.0          # VI: 'In Standby' shown only when standby is set and speed > 40 %
  - id: turbo3
    label: "Turbo 3"
    in_use: true
    control_mode: hipace_rs485
    gate_valve: gate3
    turbo_valve: turbo3_valve
    gauge: turbo3_gauge
    hipace_rs485:                          # ACTIVE (2026-10-09): TC 400 over RS-485, Pfeiffer Vacuum protocol
      port: COM3                           # !! CHECK: the converter's COM port on the lab PC
      address: 3                           # !! CHECK: this pump's [P:797] (both ship at 1 - change one first)
      take_control: true                   # writes [P:060] = 2 at start-up (the D-Sub Motor/Standby lines are then ignored)
      restore_interface_on_exit: false     # true = put [P:060] back to the D-Sub at exit (pump stopped either way)
      comm_warn_s: 3.0
      comm_timeout_s: 20.0
      isolate_on_comm_loss: true
      port_reset_s: 10.0
      motor_confirm_s: 5.0                 # [P:010] read-back is cross-checked (5005) only this long after a command
      error_code: 5007
      error_message: "Turbo 3 Error: {error_text}"
      error_requires_chiller: false
      warning_is_error: false              # [P:303] 'Wrn...' is shown but does not stop Auto mode
      standby_speed_min_pct: 40.0
      speed_set_min_pct: 20.0
      speed_set_max_pct: 100.0
    # D-SUB (previous wiring): DO Mod3/port0/line6..7 = Motor / Standby (the VI creates only two lines
    # for Turbo 3 - there is NO reset line); speed on Mod8/ai6; error on DI Mod2/port0/line17.
    hipace_dsub25:
      speed_ai: Mod8/ai6                   # 'Turbo_3_Speed_Read'
      speed_ai_min_v: -10.0
      speed_ai_max_v: 10.0
      error_di: Mod2/port0/line17          # 'Turbo 3 Error read'
      error_di_inverted: true
      error_requires_chiller: false
      motor_do: Mod3/port0/line6           # 'Turbo 3 Motor CMD'
      standby_do: Mod3/port0/line7         # 'Turbo 3 Standby CMD'
      # error_ack_do: Mod3/port0/line8     # not wired in the VI ('Reset Both HiPaces' only resets Turbo 2) – add if the cable has it
      error_code: 5007
      error_message: "Turbo 3 Error."
      standby_speed_min_pct: 40.0
  # ---- TMP4: Shimadzu on its HD15 remote connector (2026-10-13).  Outputs on the new NI-9472 in slot 5:
  #      line0 = Reset, line1 = Standby, line2 = Start/Stop.  Status on Mod2: line18 = speed above 80 %,
  #      line19 = running at any speed (until fully stopped), line20 = Alarm, line21 = Warning (24 V = condition present,
  #      i.e. NOT inverted - unlike Turbo 1's normally-closed contacts).  Backed through Turbo 1's turbo
  #      valve, so it shares Turbo 1's turbo valve and gauge.
  - id: turbo4
    label: "Turbo 4"
    in_use: true
    # Gate 4 is new and sometimes sticks shut (2026-10-28).  In Auto, if it does not open when
    # commanded: close it, switch TMP4 off, show this popup and carry on with the other turbos
    # (instead of a gate conflict that stops Auto).  'Clear Error' lets Auto try TMP4 again.
    isolate_on_gate_failure: true
    gate_failure_message: "Unable to open TMP4 gate valve, might need Thor's hammer!"
    gate_open_timeout_s: 30            # gate 4 is slow: it gets 30 s from the open command to read OPEN before
                                       # it counts as stuck (2026-10-29: was the 9 s gate settle time - it was
                                       # closed again half way open)
    control_mode: shimadzu_contacts
    gate_valve: gate4
    turbo_valve: turbo1_valve
    gauge: turbo1_gauge
    shimadzu_contacts:
      at_speed_di:      Mod2/port0/line18    # "spinning > 80 %" = full speed (standby stays below 80 %)
      at_speed_pct: 80.0                     # (what that contact means - used by the simulator)
      rotating_di:      Mod2/port0/line19    # 'running': on whenever the rotor turns, at ANY speed, until it has
                                             # fully stopped (corrected 2026-10-28 - it is NOT accel/decel)
      alarm_di:         Mod2/port0/line20
      alarm_di_inverted: false               # 24 V = alarm
      warning_di:       Mod2/port0/line21
      warning_di_inverted: false             # 24 V = warning
      motor_do:         Mod5/port0/line2     # Start / Stop
      standby_do:       Mod5/port0/line1
      error_ack_do:     Mod5/port0/line0     # Reset - pulsed by 'Reset Turbos'
      error_ack_pulse_ms: 1000
      error_code: 5005
      error_message: "{label} {what}"
      warning_is_error: true                 # as Turbo 1 (the VI); false = show the warning only
  # ---- TMP5 and TMP6: Pfeiffer HiPace on the RS-485 bus with Turbos 2 and 3 (four HiPace in total).
  #      Gates on Mod5 line3 / line5; backed through Turbo 2's / Turbo 3's turbo valve and gauge.
  - id: turbo5
    label: "Turbo 5"
    in_use: true
    control_mode: hipace_rs485
    gate_valve: gate5
    turbo_valve: turbo2_valve
    gauge: turbo2_gauge
    hipace_rs485:
      port: COM3                           # !! CHECK: same converter as Turbos 2/3?
      address: 5                           # !! CHECK: this pump's [P:797]
      take_control: true
      restore_interface_on_exit: false
      comm_warn_s: 3.0
      comm_timeout_s: 20.0
      isolate_on_comm_loss: true
      port_reset_s: 10.0
      motor_confirm_s: 5.0
      error_code: 5007
      error_message: "Turbo 5 Error: {error_text}"
      error_requires_chiller: false
      warning_is_error: false
      standby_speed_min_pct: 40.0
      speed_set_min_pct: 20.0
      speed_set_max_pct: 100.0
  - id: turbo6
    label: "Turbo 6"
    in_use: true
    control_mode: hipace_rs485
    gate_valve: gate6
    turbo_valve: turbo3_valve
    gauge: turbo3_gauge
    hipace_rs485:
      port: COM3                           # !! CHECK
      address: 6                           # !! CHECK
      take_control: true
      restore_interface_on_exit: false
      comm_warn_s: 3.0
      comm_timeout_s: 20.0
      isolate_on_comm_loss: true
      port_reset_s: 10.0
      motor_confirm_s: 5.0
      error_code: 5007
      error_message: "Turbo 6 Error: {error_text}"
      error_requires_chiller: false
      warning_is_error: false
      standby_speed_min_pct: 40.0
      speed_set_min_pct: 20.0
      speed_set_max_pct: 100.0

# ---------------------------------------------------------------- behaviour (VI constants, mBar where the VI uses mBar)
thresholds:
  turbo_on_threshold_mbar: 0.25        # 'Turbo on Threshold (torr) 2' default – despite the name the VI compares it with mBar readings.
                                       # (the small chamber uses 2e-1 mBar on the test engineer's request; change here if wanted)
  turbo_on_wiggle_room_multiplier: 5.0 # 'Threshold_wiggle_room_multiplier': Engage check WRG and foreline < 5 x threshold
  min_time_below_threshold_s: 30.0     # 'Elapsed Time' 30 s below threshold in Pumping to Rough
  gauge_error_threshold_mbar: 1.0e-8
  wrg_error_threshold_mbar: 1.0e-9
  turbo_high_pressure_shutoff_mbar: 5.0   # 'Turbo N Gauge < 5.0' – motor forced off above 5 mBar ("High pressure turbo N shuttoff")
  turbo_speed_reached_pct: 95.0        # 'Turbo Speed Reached Threshold'
  turbo_slow_speed_pct: 5.0            # 'Turbo Slow Speed Threshold'
  turbo_spinning_pct: 15.0             # constant 15 % in the Pumping-to-Rough shut-off decision and the Engage log text
  turbo_engage_msg_speed_pct: 15.0     # "Pressure low enough to open gates" vs "...turn on turbos" (VC100: 15 %)
  turbo_slowing_threshold_pct: 50.0    # 'Turbo slowing Threshold (%)' control default – Overnight / Venting / Turbo slowing
  overnight_chiller_speed_pct: 10.0    # unused while auto_mode.overnight_backing_while_spinning is true
  manual_main_pressure_max_mbar: 0.0133  # Manual (interlocked) mode only – same values as the small chamber, in mBar
  manual_foreline_pressure_max_mbar: 2.13
  compressor_min_bar: 5.0              # 'Air Compressor Pressure Calc (Bar) < 5.0'
  compressor_low_time_s: 5.0           # ... for 5 s ('Elapsed Time5') -> "Compressor Pressure Below 5 Bar!" (stops Auto mode)
  turbo_valve_foreline_ok_mbar: 1.0e-1  # turbo valve may open (primary running) when the foreline is below the turbo
                                       # gauge OR below this - the turbos' normal backing pressure (2026-10-28)
  turbo_exposure_max_mbar: null        # 2026-11-11: highest chamber pressure a TURNING turbo may be joined to (exhaust:
                                       # bypass + its turbo valve; inlet: its gate).  Above it Auto shuts the turbo valves
                                       # BEFORE the bypass may open and the turbos coast isolated until the chamber is
                                       # roughed.  null = wiggle room x turbo-on threshold = 1.25 mBar (the VI's Engage check)
  turbo_foreline_max_mbar: 3.0         # 2026-11-12 backing lost: turbo turning, turbo valve open, bypass shut and the
                                       # foreline above this -> gate and turbo valve shut, motor off, error 5012.  (The
                                       # primary pump's run read-back not following its command does the same.)
                                       # 3 mBar: the logs show at most 3.9e-1 mBar during turbo run-up, and atmosphere
                                       # within 6 s of the pump stopping.  null = the exposure limit, 1.25 mBar
  gauge_dead_below_volts: 1.0          # 2026-11-16 a watched gauge (chamber, foreline, turbo gauges) below this for
                                       # gauge_fault_delay_s is DEAD -> pop-up, error 5014, safe shutdown.  A dead or
                                       # unplugged gauge sends about 0 V; in the logs none ever read below 2.7 V.
                                       # null = off.  One gauge can have its own value: gauges[].dead_below_volts
  high_vac_pressure_trip_mbar: 1.0e-1  # 2026-11-12 pressure rise in Pumping to High Vac: chamber above this for
                                       # pressure_trip_delay_s -> gates closed, error 5013, Auto stops (turbos coast
                                       # down with primary and chiller on).  Normal work stays below
                                       # 1e-2 mBar, so 1e-1 is a leak.  Counts once the chamber has pumped down below
                                       # half of it after the gates opened; null = the exposure limit (1.25 mBar).
  high_vac_pressure_slow_trip_mbar: 1.0e-2   # 2026-11-17 a second, SLOWER trip: chamber above this for
                                       # pressure_slow_trip_delay_s (30 s) -> the same reaction, error 5013.  A
                                       # pressure that SETTLES between 1e-2 and 1e-1 mBar is a leak too.  Counts once
                                       # the chamber has been below half of it.  Logs: once below 1e-3 mBar the
                                       # chamber never came back above 1e-3 mBar in 18 days.  null = off
  turbo_speed_drop_pct: 5              # 2026-11-17 speed-drop trip: a turbo that loses speed fast has gas on it,
                                       # whatever the gauges say -> EVERY gate and turbo valve shut, motors off,
                                       # error 5015, until 'Clear Error'.  Per cent OF FULL SPEED.
                                       # FAST rule: this much within turbo_speed_drop_window_s - 5 % in 1 s (test
                                       # engineer, 2026-11-17).  Suspended for turbo_speed_drop_expected_s after
                                       # anything expected to slow a rotor down: its motor switched, standby, its
                                       # gate opening onto it, the chiller switched off.  null = off
  turbo_speed_crash_pct: 30            # CRASH rule: this much within turbo_speed_crash_window_s (30 % in 5 s) -
                                       # always on.  The incidents of 28 Oct and 5 Nov fell at 5-16 % per second;
                                       # logs: a HiPace loses at most 0.6 % in the 5 s after its motor is switched
                                       # off and 2.8 % in the 5 s after its gate opens onto it.  Turbos 2, 3, 5, 6
                                       # only: the Shimadzu pumps (which brake when switched off) give no speed.
  turbo_start_before_gates_below_mbar: 1.0e-2   # Engage below this: turbos start with the gates CLOSED, run up to
                                       # standby, THEN the gates open (2026-10-28).  At/above it: the VI's order
                                       # (gates first, then turbos).  null = always the VI's order.
                                       # Decided ONCE per Engage (2026-11-11) on the lower of the reading now and the
                                       # reading when Pump to High Vac was pressed; the panel shows the wait.
  turbo_full_speed_timeout_s: 900      # Auto 'Pumping to High Vac': a turbo not at full speed after 15 min is logged
                                       # ("!! Turbo N NOT at full speed ...") and its speed reading turns red (2026-10-27)
  # Pumping-to-Rough start order: the VC100 VI always starts the primary pump first and opens the bypass
  # after 20 s (null below keeps that).  Set e.g. bypass_first_above_mbar: 50.0 for the test engineer's rule
  # used on the small chamber (bypass first above 5e1 mBar).
  bypass_first_above_mbar: null
  # Overnight Pump below this pressure skips roughing (test engineer's rule on the small chamber: 0.2 mBar).
  # null = the VI's behaviour (always rough first).
  overnight_skip_below_mbar: null

timings:
  primary_warmup_s: 20.0        # (kept for reference – the gap below is what is used)
  primary_warmup_enabled: false
  primary_to_bypass_gap_s: 20.0 # 'Elapsed Time3' 20 s: primary pump on, then the bypass valve opens
  disengage_wait_s: 1.0         # 'Elapsed Time2'
  vent_duration_s: 900.0        # 'Elapsed Time4' 60 x 15 = 15 min
  pressure_trip_delay_s: 2.0    # 2026-11-12: chamber above high_vac_pressure_trip in Pumping to High Vac this long ->
                                #   gates closed, error 5013
  pressure_slow_trip_delay_s: 30.0   # chamber above high_vac_pressure_slow_trip this long -> the same
  turbo_speed_drop_window_s: 1.0     # speed-drop trip, fast rule: the fall is measured over this long
  turbo_speed_crash_window_s: 5.0    # ... crash rule: over this long
  turbo_speed_drop_confirm_s: 1.0    # ... and must still be there this much later (one bad reading is not a trip)
  turbo_speed_drop_expected_s: 15.0  # ... the fast rule is off this long after an expected slow-down (see thresholds)
  turbo_speed_drop_blank_after_switch_s: 0.0  # ... nothing judged this long after a motor is switched on or off
                                #   (0: a HiPace's speed reading follows the rotor; small chamber: 120)
  backing_lost_delay_s: 0.3     # primary not running / foreline above its limit this long -> turbo valves closed, 5012
  gauge_fault_delay_s: 3.0      # 2026-11-16: a gauge below gauge_dead_below_volts this long -> error 5014
  gauge_frozen_readings: 100    # 2026-11-16: this many readings in a row EXACTLY equal -> the gauge is frozen, error
                                #   5014 (a live gauge always has noise; in the logs never more than 10 equal rows
                                #   running).  Not judged within 0.1 V of the ends of the input range.  0 = off
  valve_settle_ms: 1000         # Wait after a valve command changed ...
  bypass_settle_ms: 2000        # ... 2000 ms if the bypass changed ...
  gate_settle_ms: 9000          # ... 9000 ms if a gate changed
  turbo_standby_min_s: 20.0     # turbos-first Engage: a Shimadzu (no speed signal) counts as at standby after this
                                #   long running and no longer 'Accel'; a HiPace when at its [P:717] standby speed
  turbo_standby_timeout_s: 600  # ... not all at standby after 10 min -> logged, gates opened anyway
  chiller_settle_ms: 10000      # Wait 10 s after the chiller command changed
  primary_settle_ms: 10000      # Wait 10 s after the primary pump is switched ON ...
  primary_settle_off_ms: 0      # ... nothing when it is switched off
  blocking_waits: true          # freeze the loop during the waits, exactly like the VI
  gate_open_stagger_s: 5.0      # 2026-10-26: the six gate valves share one compressed-air line - open them
                                # one at a time, >= 5 s apart (Auto starts the turbos once all are open)

# ---------------------------------------------------------------- Auto-mode rules that differ from Main_V4.4
auto_mode:
  ask_manual_vent_valve: false             # 2026-10-26: VC100 has no hand vent valve - no 'Is the manual vent valve closed?'
  turbo_valve_needs_backing: true          # 2026-10-28: a turbo valve opens only once the primary pump runs AND the
                                           # foreline gauge is below that valve's turbo gauge (Auto + Manual; Admin warns)
  overnight_backing_while_spinning: true   # Overnight: primary + chiller keep running and each spinning turbo's
                                           # valve stays open until that turbo is below the slowing threshold
  turbo_valve_gauge_rule: true             # turbo valves compared with the turbo gauges (see docs/VC100_REFERENCE.md)
  standby_when_gate_closed: true           # Standby line = motor commanded AND gate closed
  shut_off_spins_down_first: true          # 'Shut Off' with a spinning turbo -> Turbo slowing, not Facility Off
  start_turbo_with_its_gate: true          # 2026-11-13 Engage Turbo: each turbo starts as soon as its OWN gate is open
                                           # (from rest, gate open - as before) instead of waiting for all six gates.
                                           # About half a minute sooner at vacuum.  false = start them all after the last gate.
  vent_closes_on_shutdown: true            # 'Shutdown Now' closes the vent valve at once
  venting_buttons_stop_turbos: true        # Shutdown Now / After Vent / Pump to Rough / Overnight in Venting stop the turbos

# Buttons of the VI's tab pages (page number = TabPage: 0 Facility Off, 1 Pumping to Rough, 3 Overnight,
# 5 Pumping to High Vac, 7 Venting, 8 Turbo slowing; 2/4/6 have no buttons).  Label = the VI's caption,
# action = what the state machine does.
auto_buttons:
  0:
    - {label: "Pump to Rough",       action: pump_to_rough}
    - {label: "Pump to High Vac",    action: pump_to_high_vac}
    - {label: "Overnight Pump",      action: overnight_pump}
    - {label: "Vent",                action: vent}
    - {label: "Shut Off once rough", action: shut_off_once_rough}   # rough the chamber, then everything off
  1:
    - {label: "Pump to Rough",       action: pump_to_rough}
    - {label: "Pump to High Vac",    action: pump_to_high_vac}
    - {label: "Overnight Pump",      action: overnight_pump}
    - {label: "Vent",                action: vent}
    - {label: "Shut Off once rough", action: shut_off_once_rough}
    - {label: "Shut Off",            action: shut_off}
  2: []
  3:
    - {label: "Pump to Rough",       action: pump_to_rough}
    - {label: "Pump to High Vac",    action: pump_to_high_vac}
    - {label: "Vent",                action: vent}
  4: []
  5:
    - {label: "Shutdown",            action: shutdown}
    - {label: "Pump to Rough",       action: pump_to_rough}
    - {label: "Overnight Pump",      action: overnight_pump}
    - {label: "Vent and shutdown",   action: vent_and_shutdown}
    - {label: "Vent",                action: vent}
  6: []
  7:
    - {label: "Shutdown Now",        action: shut_off}             # closes the vent, turbos slow down, then off
    - {label: "Shutdown After Vent", action: shutdown_after_vent}  # finish the 15 min vent, then off
    - {label: "Pump to Hi vac",      action: pump_to_high_vac}
    - {label: "Overnight Pump",      action: overnight_pump}
    - {label: "Pump to Rough",       action: pump_to_rough}
  8:
    - {label: "Pump to High Vac",    action: pump_to_high_vac}
    - {label: "Vent",                action: vent}

logging:
  csv_enabled: true             # the VI writes a CSV every 5 s to C:/Users/Lab Admin/Desktop/Pressure_Data
  csv_directory: logs           # (a path is fine here too, e.g. "C:/Users/Lab Admin/Desktop/Pressure_Data")
  csv_period_s: 5.0
  event_log_max_lines: 2000

# ---------------------------------------------------------------- simulation model (no DAQ)
simulation:
  # Plant model for --sim and the tests.  The numbers marked [log] were measured from this facility's
  # own CSV logs of 2026-10-23 .. 2026-11-11 (docs/PLANT_FROM_LOGS.md); only ratios matter, so the
  # chamber volume is a round figure and the pump speeds are fitted to it.
  time_scale: 1.0
  chamber_volume_l: 1000.0
  foreline_volume_l: 8.0
  primary_pump_speed_l_s: 45.0
  primary_half_speed_torr: 0.4   # [log] roughing slows from a decade per ~60 s to a decade per ~170 s near 2e-1 mBar
  bypass_conductance_l_s: 100.0  # [log] atmosphere -> 1.7e-1 mBar in 5 min 50 s once the bypass is open
  vent_conductance_l_s: 8.2      # [log] vent: 500 mBar after 45-80 s, 990 mBar after 80-140 s (near-linear rise)
  primary_ultimate_torr: 3.5e-3  # [log] foreline 4-6e-3 mBar with the turbos at full speed, no gas
  foreline_backfill_s: 2.0       # [log] primary pump stopped -> foreline at 1020 mBar in under 6 s
  turbo_pump_speed_l_s: 1200.0
  turbo_body_initial_torr: 1.0   # [log] turbo gauges read 0.3-5 mBar with everything off
  turbo_spinup_s: 150.0          # [log] HiPace 0 -> 100 % in 130-160 s
  turbo_spindown_s: 2600.0       # [log] HiPace motor off: 1.8-2.8 %/min, backed or isolated -> ~45 min to stop
  turbo_overrides:               # [log] the Shimadzu pumps: at speed after ~370 s, brake to a stop in ~9.5 min
    turbo1: {spinup_s: 370.0, spindown_s: 570.0}
    turbo4: {spinup_s: 370.0, spindown_s: 570.0}
  turbo_air_brake_pct_s: 15.0    # [log] exhaust on atmosphere: 78 % -> 5 % in under 10 s (2026-11-05)
  turbo_trips_on_pressure: null  # [log] the HiPace pumps only WARNED in both incidents - no error
  valve_actuation_s: 0.8
  atmosphere_torr: 760.0
  chamber_ultimate_torr: 4.0e-7  # [log] 5e-7 .. 1.6e-6 mBar after an hour
  leak_torr_l_s: 4.0e-4          # [log] everything off: chamber rises ~9e-7 mBar/s; base 5e-7 .. 1.6e-6 mBar
  outgassing_torr_l_s: 5.0e-5
  compressor_bar: 6.1            # [log] 5.8 .. 6.35 bar
