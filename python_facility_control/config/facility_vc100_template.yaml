# TEMPLATE ONLY – VC100 (medium facility, 3 turbos, 8 valves) from the Confluence "VC100 DAQ Pinout"
# page.  It demonstrates that the controller/GUI scale to several turbo branches; it has NOT been
# checked against VC100_Facility_Control_V1.1.vi (state thresholds, timings, the Shimadzu contact
# interface, compressor check and mBar gauge curves still need to be confirmed from that VI).
facility:
  id: vc100_template
  name: "VC100 Facility Control (TEMPLATE – unverified)"
  daq_name: cDAQ1
  loop_period_ms: 100
  status_wait_ms: 10
  pressure_unit_default: mbar

analog_input:
  sample_rate_hz: 1000.0
  samples_per_channel: 200
  min_v: 0.0
  max_v: 10.0

gauges:
  - {id: wrg,   label: "Wide Range Gauge", plot_label: "Main Gauge",          channel: Mod8/ai0, formula: leybold_ptr90, role: main_chamber}
  - {id: pir_f, label: "Foreline Gauge",   plot_label: "Foreline Convectron", channel: Mod8/ai1, formula: leybold_ttr91, role: foreline}
  - {id: pir_1, label: "Turbo 1 Gauge",    plot_label: "Turbo 1 Gauge",       channel: Mod8/ai2, formula: leybold_ttr91, role: turbo, turbo: turbo1}
  - {id: pir_2, label: "Turbo 2 Gauge",    plot_label: "Turbo 2 Gauge",       channel: Mod8/ai3, formula: leybold_ttr91, role: turbo, turbo: turbo2}
  - {id: pir_3, label: "Turbo 3 Gauge",    plot_label: "Turbo 3 Gauge",       channel: Mod8/ai4, formula: leybold_ttr91, role: turbo, turbo: turbo3}

extra_analog: []

compressor:
  channel: Mod8/ai16          # TODO: confirm the compressor pressure sensor channel and scaling

valves:
  bypass:        {label: "Bypass Valve",  cmd: Mod1/port0/line0, read: Mod2/port0/line0, kind: bypass, fail_closed: false}
  vent:          {label: "Vent Valve",    cmd: Mod1/port0/line1, read: Mod2/port0/line1, kind: vent,   fail_closed: true}
  turbo1_valve:  {label: "Turbo 1 Valve", cmd: Mod1/port0/line2, read: Mod2/port0/line2, kind: turbo,  turbo: turbo1, fail_closed: true}
  turbo2_valve:  {label: "Turbo 2 Valve", cmd: Mod1/port0/line3, read: Mod2/port0/line3, kind: turbo,  turbo: turbo2, fail_closed: true}
  turbo3_valve:  {label: "Turbo 3 Valve", cmd: Mod1/port0/line4, read: Mod2/port0/line4, kind: turbo,  turbo: turbo3, fail_closed: true}
  gate1:         {label: "Gate 1 Valve",  cmd: Mod1/port0/line5, read: Mod2/port0/line5, kind: gate,   turbo: turbo1, fail_closed: false}
  gate2:         {label: "Gate 2 Valve",  cmd: Mod1/port0/line6, read: Mod2/port0/line6, kind: gate,   turbo: turbo2, fail_closed: false}
  gate3:         {label: "Gate 3 Valve",  cmd: Mod1/port0/line7, read: Mod2/port0/line7, kind: gate,   turbo: turbo3, fail_closed: false}

primary_pump:
  label: "Primary Pump"
  cmd: Mod4/port0/line0       # NI-9481 relay -> soft starter
  read: Mod2/port0/line8      # soft-starter aux contact 13/14
  cross_check: true

chiller:
  label: "Chiller"
  cmd: Mod4/port0/line1       # 'Chiller/Turbo Power Command' contactor
  read: Mod2/port0/line9
  cross_check: true

turbos:
  - id: turbo1
    label: "Turbo 1"
    in_use: true
    control_mode: hipace_dsub25   # TODO: Turbo 1 is a Shimadzu TMP-V2304LM (dry contacts, no speed AI) – needs a 'shimadzu_contacts' mode
    gate_valve: gate1
    turbo_valve: turbo1_valve
    gauge: pir_1
    hipace_dsub25:
      error_di: Mod2/port0/line14     # Shimadzu alarm (closed until alarm -> inverted)
      error_di_inverted: true
      motor_do: Mod3/port0/line0
      standby_do: Mod3/port0/line1
      error_ack_do: Mod3/port0/line2
      error_ack_pulse_ms: 500
  - id: turbo2
    label: "Turbo 2"
    in_use: true
    control_mode: hipace_dsub25
    gate_valve: gate2
    turbo_valve: turbo2_valve
    gauge: pir_2
    hipace_dsub25:
      speed_ai: Mod8/ai5
      error_di: Mod2/port0/line16
      error_di_inverted: true       # HiPace pin 9: 24 V = healthy
      motor_do: Mod3/port0/line3
      standby_do: Mod3/port0/line4
      error_ack_do: Mod3/port0/line5
      error_ack_pulse_ms: 500
  - id: turbo3
    label: "Turbo 3"
    in_use: true
    control_mode: hipace_dsub25
    gate_valve: gate3
    turbo_valve: turbo3_valve
    gauge: pir_3
    hipace_dsub25:
      speed_ai: Mod8/ai6
      error_di: Mod2/port0/line17
      error_di_inverted: true
      motor_do: Mod3/port0/line6
      standby_do: Mod3/port0/line7
      error_ack_pulse_ms: 500

thresholds:
  turbo_on_threshold_torr: 0.25       # TODO: take from the VC100 VI
  compressor_min_bar: 4.5             # TODO: confirm

timings: {}

logging:
  csv_enabled: true
  csv_directory: logs
  csv_period_s: 5.0

simulation:
  chamber_volume_l: 800.0
  turbo_pump_speed_l_s: 700.0
  compressor_bar: 6.3
