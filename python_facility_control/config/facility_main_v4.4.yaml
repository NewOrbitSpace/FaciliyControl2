# Facility profile: exact port of LabVIEW Main_V4.4.vi (single turbo facility).
# Every value here was taken from the VI (see docs/MAIN_V4.4_REFERENCE.md).
# To create another facility copy this file, change the channel map and add/remove
# turbo branches; the controller and GUI adapt to the number of turbos/gauges.

facility:
  id: main_v4.4
  name: "Facility Control (Main_V4.4 port)"
  daq_name: cDAQ1            # 'Real_DAQ?' True -> cDAQ1, False -> cDAQ2 in the VI
  loop_period_ms: 100         # Wait Until Next ms Multiple in frame 5
  status_wait_ms: 10          # Wait (ms) in frame 2
  pressure_unit_default: mbar # torr | mbar  (runtime switchable) - mBar by default on the lab panel

# ---------------------------------------------------------------- hardware
analog_input:
  sample_rate_hz: 1000.0      # 'rate' control
  samples_per_channel: 200    # 'samples per channel' control (mean is used)
  min_v: 0.0
  max_v: 10.0
  terminal_config: differential  # the VI wires the gauges differentially (DAQmx value 10106).
                                  # Must match the wiring or pressures read wrong. Options:
                                  # differential | rse | nrse | pseudo_diff | default

gauges:                       # order = plot order in the VI chart
  - id: wrg
    label: "Wide Range Gauge"
    plot_label: "Main Gauge"
    channel: Mod1/ai5
    formula: ion_gauge        # P_Torr = 10**(1.667*V - 11.46)
    role: main_chamber
  - id: conv2
    label: "Foreline Convectron"
    plot_label: "Foreline Convectron"
    channel: Mod1/ai2         # 'Convectron_2_Read'
    formula: convectron       # P_Torr = 10**V * 1e-4
    role: foreline
  - id: conv1
    label: "Turbo Convectron"
    plot_label: "Turbo Convectron"
    channel: Mod1/ai1         # 'Convectron_1_Read'
    formula: convectron
    role: turbo               # belongs to turbo 'turbo1'
    turbo: turbo1

extra_analog: []              # display-only analog readings (panel box + CSV column) – none on this chamber.
                              # The VI read 'Com Potential' on Mod1/ai6; that input now carries the
                              # primary pump's drive frequency (see primary_pump.frequency below).
                              # To add one on another facility:
                              #   - {id: com_potential, label: "Com Potential (V)", channel: Mod1/ai7}

# compressor:                 # compressed-air pressure sensor (VC100 feature) – not fitted on this chamber.
#   channel: Mod8/ai16        # adding this block shows the "Compressor Pressure (Bar)" box, logs it to CSV,
#                             # enables the "Compressor air low" fault in the simulator and, together with
#                             # thresholds.compressor_min_bar, raises error 5011 when the pressure is low.

valves:                       # cmd: 24 V = open ; read: reed switch 24 V = open
  turbo_valve: {label: "Turbo Valve",  cmd: Mod4/port0/line0, read: Mod2/port0/line2, kind: turbo,  turbo: turbo1, fail_closed: true}
  bypass:      {label: "Bypass Valve", cmd: Mod4/port0/line1, read: Mod2/port0/line3, kind: bypass, fail_closed: false}
  vent:        {label: "Vent Valve",   cmd: Mod4/port0/line2, read: Mod2/port0/line4, kind: vent,   fail_closed: true}
  gate:        {label: "Gate Valve",   cmd: Mod4/port0/line3, read: Mod2/port0/line5, kind: gate,   turbo: turbo1, fail_closed: false}

primary_pump:
  # Hardware change (2026-09-14): the pump is driven through TWO relays on Mod3.  Power and run are
  # separate and the run relay only has an effect once the power relay is closed, so the controller
  # sequences
  #   start:  power on -> timings.primary_power_to_run_gap_s -> run on
  #   stop:   run off  -> timings.primary_run_to_power_off_gap_s -> power off
  # The old single command line (Mod3/port0/line0) and the DI run read-back (Mod2/port0/line0) are
  # no longer wired to the pump.
  label: "Primary Pump"
  power_cmd: Mod3/port0/line6   # relay 1: mains power to the pump
  run_cmd:   Mod3/port0/line7   # relay 2: start/run (only effective once powered)
  cross_check: true             # error 5000 if it is commanded to run but never spins up
                                # (only checkable while the frequency reader below is ON)
  frequency:
    # The drive-frequency sensor.  `enabled` is only the STARTUP default: the operator turns the
    # reader on and off from the panel ("Pump frequency reader connected"), because whether the
    # sensor is physically wired is their call.  It has its own single-channel DAQ task, so it is
    # opened and closed without disturbing the gauge task.
    #
    # Default OFF since 2026-09-21: acquiring this channel put noise on the other analog readings.
    # While the reader is off the channel is not acquired at all and the pump has NO feedback, so
    # "Primary Pump is On" means the run relay is closed, error 5000 cannot fire (a pump that fails
    # to start is not detected) and the hour meter counts commanded hours.  That is the same
    # position Main_V4.4.vi was always in.  Set enabled: true here, or just tick the box on the
    # panel, once the wiring is sorted.
    enabled: false
    channel: Mod1/ai6           # 0-10 V from the drive (this input used to carry 'Com Potential')
    min_v: 0.0
    max_v: 10.0
    max_hz: 210.0               # 10 V = 210 Hz (drive maximum)
    running_above_hz: 5.0       # above this the pump counts as running (status, interlocks, hour meter)

chiller:
  label: "Chiller"
  cmd: Mod3/port0/line1
  read: Mod2/port0/line1
  cross_check: true             # error 5004

turbos:
  - id: turbo1
    label: "Turbo Pump"
    in_use: true                # VC100/VC140 'Turbo X in use?' constant -> runtime config here
    control_mode: bigred_dsub15 # bigred_dsub15 | hipace_dsub25 | hipace_rs485   (VI constant = 2)
    gate_valve: gate
    turbo_valve: turbo_valve
    gauge: conv1
    # --- BigRed D-SUB15 (Tubro_Control_Mode = 2)
    bigred_dsub15:
      speed_ai: Mod1/ai4          # +/-10 V, x10 -> %
      speed_ai_min_v: -10.0
      speed_ai_max_v: 10.0
      error_di: Mod2/port0/line7  # True = error
      still_spinning_di: Mod2/port0/line8
      motor_do: Mod3/port0/line4
      standby_do: Mod3/port0/line5
    # --- HiPace 700 D-SUB25 (Tubro_Control_Mode = 0)
    hipace_dsub25:
      speed_ai: Mod1/ai3          # 0-10 V, x10 -> %
      speed_sample_rate_hz: 4000.0
      speed_samples: 2000
      error_di: Mod2/port0/line6  # 24 V = healthy -> error = NOT(line)
      error_di_inverted: true
      motor_do: Mod3/port0/line2
      error_ack_do: Mod3/port0/line3
      error_ack_pulse_ms: 1000
    # --- HiPace RS485 (Tubro_Control_Mode = 1) – not used on this facility
    hipace_rs485:
      port: COM4
      address: 2
      rpm_full_speed: 820         # rpm*0.016667/820*100 = % in the VI
      standby_speed_pct: 66

# ---------------------------------------------------------------- behaviour (VI constants)
thresholds:
  turbo_on_threshold_torr: 0.150012   # = 2e-1 mBar ('Turbo on Threshold' control default; starts the next turbo step)
  turbo_on_wiggle_room_multiplier: 5.0 # Engage Turbo check uses 5 x threshold on WRG and foreline
  min_time_below_threshold_s: 30.0    # pressure must stay below threshold this long (Pumping to Rough)
  gauge_error_threshold_torr: 1.0e-8  # WRG must be above this (gauge sanity) in Pumping to Rough
  wrg_error_threshold_torr: 1.0e-9    # WRG must be above this in Engage Turbo
  turbo_high_pressure_shutoff_torr: 5.0  # turbo motor forced off if Turbo Convectron >= 5 Torr
  turbo_speed_reached_pct: 95.0
  turbo_slow_speed_pct: 5.0
  turbo_spinning_pct: 15.0            # 'still spinning' threshold used by the state machine
  turbo_engage_msg_speed_pct: 2.0
  overnight_chiller_speed_pct: 10.0
  manual_main_pressure_max_torr: 0.01 # Manual mode: turbo may start if Turbo Convectron < this
  manual_foreline_pressure_max_torr: 1.6
  # Pumping-to-Rough start order (test engineer, 2026-09-08):
  #   chamber above this -> open the bypass valve FIRST, then start the primary pump
  #   chamber below this -> start the primary pump first, bypass follows after primary_to_bypass_gap_s
  bypass_first_above_torr: 37.503084  # 5e1 mBar
  # Overnight Pump pressed below this pressure skips roughing (no primary pump, no bypass)
  overnight_skip_below_torr: 0.150012 # 2e-1 mBar
  # "Is the manual vent valve closed?" is only asked at or above this chamber pressure (2026-09-23).
  # Below it the chamber is plainly already pumped down, which is itself proof the hand valve is
  # shut.  Set to null to ask every time, whatever the pressure.
  vent_confirm_above_mbar: 5.0e2

timings:
  primary_warmup_s: 60.0        # Pumping to Rough substate 1 (in the VI OR-ed with TRUE -> effectively skipped)
  primary_warmup_enabled: false # set true to actually wait for the warm-up
  disengage_wait_s: 1.0
  vent_duration_s: 600.0        # 10 min
  primary_to_bypass_gap_s: 25.0 # primary pump -> bypass valve gap (low-pressure branch), 20-30 s
  valve_settle_ms: 1000
  gate_settle_ms: 9000
  chiller_settle_ms: 10000
  primary_settle_ms: 500
  # Two-relay primary pump (hardware change 2026-09-14).  The loop keeps reading during these gaps
  # – they sequence the two relays, they are not cross-check settle windows.
  primary_power_to_run_gap_s: 15.0     # power relay closed -> wait -> run relay closed
  primary_run_to_power_off_gap_s: 300.0  # run relay opened -> wait 5 min -> power relay opened
                                       # (the pump keeps its power while it coasts to a stop; the STOP
                                       #  button and program exit still drop both relays immediately)
  primary_spinup_timeout_s: 30.0       # commanded to run but below running_above_hz this long -> error 5000
                                       # (inert while the frequency block above is commented out)
  # true  = like the VI: the loop freezes (no readings / error checks) for the settle waits above and
  #         while a Yes/No dialog is open, so a device is only cross-checked after its full settle time.
  # false = readings, plots and error monitoring continue during the waits; only the decision step
  #         waits and a moving device is not cross-checked until its settle time is over.
  blocking_waits: true

auto_mode:
  # Overnight Pump: keep the primary pump and chiller running, and the spinning turbo's valve open,
  # until the turbo has slowed below the slowing threshold - then everything off (2026-09-23).
  # Main_V4.4.vi switched the primary off at once, with the turbo still near full speed; the foreline
  # then backfilled towards atmosphere and the turbo tripped on its own inlet pressure (error 5007).
  # The VC100 VI always did it this way; the small chamber now does too.
  overnight_backing_while_spinning: true

logging:
  csv_enabled: true             # VC100 feature (Main_V4.4 has no file logging)
  csv_directory: logs
  csv_period_s: 5.0
  event_log_max_lines: 2000

# ---------------------------------------------------------------- simulation model (no DAQ)
simulation:
  time_scale: 1.0               # >1 speeds the plant up (not the control loop)
  chamber_volume_l: 200.0
  foreline_volume_l: 5.0
  primary_pump_speed_l_s: 12.0
  turbo_pump_speed_l_s: 700.0
  turbo_spinup_s: 60.0
  turbo_spindown_s: 120.0
  valve_actuation_s: 0.6
  atmosphere_torr: 760.0
  chamber_ultimate_torr: 2.0e-7
  leak_torr_l_s: 1.0e-4
  outgassing_torr_l_s: 2.0e-5
  compressor_bar: 6.3           # plant air supply for the pneumatic valves (only *reported* when a compressor: block exists)
